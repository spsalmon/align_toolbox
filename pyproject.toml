[project]
name = "align_toolbox"
version = "0.5.0"
authors = [
  {name="Sacha Psalmon", email="sacha.psalmon@unibe.ch" },
  {name="Boris Gusev", email="boris.gusev@unibe.ch" }
]
maintainers = [
    {name = "Sacha Psalmon", email="sacha.psalmon@unibe.ch"},
]
description = "This package implements most of the functions used in the ALIGN pipeline, a modular image analysis workflow adapted for longitudinal, high-troughput microscopy. Developed by the Towbin Lab of the University of Bern."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "pytorch-lightning",
    "torchmetrics",
    "pytorch-toolbelt",
    "segmentation-models-pytorch",
    "timm",
    "monai",
    "csbdeep",

    "scikit-learn",
    "xgboost",
    "joblib",

    "opencv-contrib-python",
    "scikit-image",
    "tifffile",

    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scipy",
    "ome-types",
    "pyyaml",

    "whittaker-eilers",
    "bottleneck",
    "matplotlib",
    "seaborn",
    "microfilm",
    "statsmodels",
    "statannotations",
]

[project.urls]
    Repository = "https://github.com/spsalmon/align_toolbox"
    Documentation = "https://align-toolbox.readthedocs.io"

[project.optional-dependencies]
dev=[
    "black",
    "isort",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# import the checked-out package, never a stale copy in site-packages
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["align_toolbox"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# the suite sits at 95%; the floor leaves room for a refactor without
# silently letting coverage rot
fail_under = 93

[tool.black]
# pin the target so black's AST safety check does not depend on the
# interpreter that happens to run the hook
target-version = ["py310"]

[tool.isort]
# keep isort's output identical to what black would produce, otherwise the
# two hooks rewrite each other on every commit
profile = "black"
line_length = 88
